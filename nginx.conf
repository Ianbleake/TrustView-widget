server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Correct MIME types for JS bundles
    include /etc/nginx/mime.types;
    types {
        application/javascript js mjs;
        text/css css;
        image/svg+xml svg;
    }

    # Cache immutables — bundle filename is stable but content is hashed internally
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri =404;
    }
}